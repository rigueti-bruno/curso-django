<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/fontawesome.min.css"
        integrity="sha512-v8QQ0YQ3H4K6Ic3PJkym91KoeNT5S3PnDKvqnwqFD1oiqIl653crGZplPdU5KKtHjO0QKcQ2aUlQZYjHczkmGw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/brands.min.css"
        integrity="sha512-58P9Hy7II0YeXLv+iFiLCv1rtLW47xmiRpC1oFafeKNShp8V5bKV/ciVtYqbk2YfxXQMt58DjNfkXFOn62xE+g=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/solid.min.css"
        integrity="sha512-DzC7h7+bDlpXPDQsX/0fShhf1dLxXlHuhPBkBo/5wJWRoTU6YL7moeiNoej6q3wh5ti78C57Tu1JwTNlcgHSjg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">

    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 62.5%;
        }

        body {
            font-size: 1.6rem;
            background: #dddcdc;
            color: #000;
            font-size: 2.4rem;
        }

        .main-header-container {
            background: #13141f;
        }

        .container {
            max-width: 144rem;
            margin: 0 auto;
            padding: 3rem;
        }

        .main-logo {
            font-size: 4rem;
            color: #fff;
            text-decoration: none;
            display: flex;
            flex-flow: row nowrap;
            align-items: center;
            justify-content: center;
            width: fit-content;
            margin: 0 auto;
        }

        .main-logo-icon {
            margin-right: 2rem;
            color: #fff;
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            font-family: 'Roboto Slab';
        }

        .search-form {
            border: .2rem solid #454545;
            max-width: 64rem;
            margin: 2rem auto;
            border-radius: .4rem;
            position: relative;
            transition: all 300ms ease-in-out;
        }

        .search-input, .search-button {
            border: none;
            background: none;
            outline: none;
            padding: 1rem;
            border-radius: .4rem;
        }

        .search-input {
            width: 100%;
            padding-right: 3rem;
        }

        .search-button {
            position: absolute;
            top: 0;
            right: 0;
            transition: all 300ms ease-in-out;
        }

        .search-button:focus {
            outline: 1px solid #fff;
            background: rgba(0,0,0,0.05);
        }

        .search-form:focus-within {
            border-color: #87ceeb;
            background: #fff;
        }

        .search-form:focus-within .search-button {
            color: #87ceeb;
        }

        .main-content {
            padding-top: 0;
        }

        .main-content-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(34,px,1fr));
            gap: 2rem;
        }

        .recipe {
            background: #fff;
            box-shadow: -5px 5px 15px rgba(0,0,0,.2);
            transition: all 300ms ease-in-out;
            transform: scale(1);
            padding: 3rem;
        }

        .recipe img {
            max-width: 100%;
            padding: 0;
            margin: 0;
        }

        .recipe-list-item {
            max-width: 64rem;
        }

        .recipe-list-item:hover {
            transform: scale(1.02);
            box-shadow: -8px 8px 18px rgba(0,0,0,.25);
        }

        .recipe-title {
            padding: 3rem;
            padding-bottom: 2rem;
        }

        .recipe-author {
            padding: 0 1.5rem;            
        }

        .recipe-author-content {
            color: #454545;
            margin-right: 1rem;
        }

        .recipe-author a {
            color: #339dc7ff;
            text-decoration: none;
            transition: all 300ms ease-in-out;
        }

        .recipe-author a:hover {
            color: #454545;
            text-decoration: none;
        }

        .recipe-content {
            padding: 3rem;
            padding-top: 2rem;
        }
     
    </style>

    <title>Recipes</title>
</head>
